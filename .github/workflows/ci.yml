# Continuous integration: everything that can be checked WITHOUT an AWS account.
#
# Runs on every push and every pull request. None of these steps touch AWS, so
# they need no credentials and are safe to run on forks.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: # lets you run it by hand from the Actions tab
  workflow_call: # lets deploy.yml re-run these checks before deploying

# Cancel an in-progress run when a newer commit is pushed to the same branch —
# there is no point testing code that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  validate:
    name: Lint, test and synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The CDK CLI is a Node.js program even when the app is written in Python.
      - name: Set up Node.js (for the CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip downloads keyed on the requirements files, so unchanged
          # dependencies are not re-downloaded on every run.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          npm install --no-fund --no-audit

      # --- Static analysis -------------------------------------------------
      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

      # --- Unit tests ------------------------------------------------------
      # These assert on the synthesized CloudFormation template: subnet
      # placement, security group rules, encryption settings, outputs, and so
      # on. See tests/test_requirements.py.
      - name: Unit tests
        run: pytest -v

      # --- Template generation --------------------------------------------
      # A successful synth proves the app is valid CDK. Dummy account/region
      # values keep it environment-agnostic so no credentials are required.
      - name: Synthesize (dev)
        run: npx cdk synth -c env=dev --quiet

      - name: Synthesize (prod)
        run: npx cdk synth -c env=prod --quiet

      # --- Security scanning ----------------------------------------------
      # cdk-nag fails the build on any unsuppressed AWS best-practice finding.
      # Every accepted exception is justified in basic_webapp/nag_suppressions.py.
      - name: Security scan (cdk-nag)
        run: npx cdk synth -c env=prod -c nag=true --quiet

      # Keep the generated templates for inspection, and so a reviewer can diff
      # the infrastructure change a pull request actually produces.
      - name: Upload synthesized templates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudformation-templates
          path: cdk.out/*.template.json
          retention-days: 14
